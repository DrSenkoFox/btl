<!-- ==================== pages/seeker-property-compare.html ==================== -->
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nhà đã lưu & So sánh | HomeFit AI</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <script src="../js/api.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/modules/seeker.js" defer></script>
  </head>
  <body>
    <nav id="site-navigation"></nav>
    <main class="site-page saved-page">
      <header class="saved-page__heading">
        <hgroup>
          <p class="saved-page__eyebrow">NHÀ ĐÃ LƯU / SO SÁNH</p>
          <h1>Căn nào hợp với cuộc sống của bạn?</h1>
          <p id="saved-summary">2 căn đã lưu · So sánh theo tiêu chí của bạn.</p>
        </hgroup>
        <a class="saved-page__add" href="seeker-property-search.html">+ Thêm nhà</a>
      </header>
      <section class="saved-properties">
        <ul class="saved-house-list" id="saved-house-list"></ul>
      </section>
      <section class="saved-comparison">
        <h2>So sánh từng tiêu chí</h2>
        <p id="comparison-empty">Chưa có dữ liệu so sánh.</p>
        <section class="saved-comparison__scroll" id="comparison-scroll" hidden>
          <table class="saved-comparison__table">
            <thead><tr id="comparison-columns"><th scope="col">Tiêu chí</th></tr></thead>
            <tbody>
              <tr data-criterion="price"><th scope="row">Giá thuê / tháng</th></tr>
              <tr data-criterion="area"><th scope="row">Diện tích / phòng</th></tr>
              <tr data-criterion="location"><th scope="row">Vị trí</th></tr>
              <tr data-criterion="amenities"><th scope="row">Tiện ích</th></tr>
              <tr data-criterion="legal"><th scope="row">Pháp lý</th></tr>
              <tr data-criterion="fit"><th scope="row">Điểm phù hợp cá nhân</th></tr>
            </tbody>
          </table>
        </section>
      </section>
    </main>
  </body>
</html>
