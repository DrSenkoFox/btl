<!-- ==================== pages/agent-listing-management.html ==================== -->
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý bài đăng | HomeFit AI</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <script src="../js/api.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/modules/agent.js" defer></script>
  </head>
  <body>
    <aside class="agent-nav" id="agent-nav"></aside>
    <main class="agent-posts-page">
      <header class="agent-header">
        <hgroup>
          <p class="agent-eyebrow">DANH MỤC CỦA MÔI GIỚI</p>
          <h1 class="agent-title">Quản lý bài đăng</h1>
          <p class="agent-desc">Chỉ bài được Kiểm duyệt viên phê duyệt mới xuất hiện với người tìm nhà.</p>
        </hgroup>
        <a href="agent-post-create.html" class="btn-primary">+ Tạo bài đăng</a>
      </header>
      <section class="agent-stats-grid">
        <article class="stat-card"><p class="stat-title">Tổng bài đăng</p><p class="stat-value" id="stat-total">0</p><p class="stat-sub" id="stat-approved"></p></article>
        <article class="stat-card"><p class="stat-title">Chờ Moderator duyệt</p><p class="stat-value" id="stat-pending-count">0</p></article>
        <article class="stat-card"><p class="stat-title">Yêu cầu liên hệ</p><p class="stat-value" id="stat-leads">0</p></article>
        <article class="stat-card"><p class="stat-title">Lịch hẹn</p><p class="stat-value" id="stat-appointments">0</p></article>
      </section>
      <section class="agent-card">
        <table class="agent-table">
          <thead>
            <tr><th>Bài đăng / Khu vực</th><th>Giá thuê</th><th>Trạng thái kiểm duyệt</th><th>Độ khớp AI</th><th>Thao tác</th></tr>
          </thead>
          <tbody id="agent-posts-tbody"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
